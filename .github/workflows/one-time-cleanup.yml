name: One-time repository cleanup

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/one-time-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply verified cleanup edits
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          editor_path = Path("Source/PluginEditor.h")
          editor = editor_path.read_text(encoding="utf-8")
          editor = replace_once(
              editor,
              r'"Version 1.0.0\n\n"',
              r'"Version " << JucePlugin_VersionString << "\n\n"',
              "About version")
          editor = replace_once(
              editor,
              r'<< "Santos Leveler Project\n\n"',
              r'<< "Jos" << juce::String::charToString (0x00e9) << " Antonio Santos Santos\n\n"',
              "About author")
          if editor.count("github.com/santosmanilva/SANTOS-LEVELER") != 2:
              raise RuntimeError("About URLs: expected exactly two uppercase repository URLs")
          editor = editor.replace("github.com/santosmanilva/SANTOS-LEVELER", "github.com/santosmanilva/Santos-Leveler")
          editor = replace_once(
              editor,
              r'<< juce::String::charToString (0x00a9) << " 2026 Santos Leveler Project\n"',
              r'<< juce::String::charToString (0x00a9) << " 2026 Jos" << juce::String::charToString (0x00e9) << " Antonio Santos Santos\n"',
              "About copyright")
          editor = replace_once(
              editor,
              r'<< "All rights reserved.";',
              r'<< "Licensed under GNU AGPL v3.0.";',
              "About licence footer")
          editor_path.write_text(editor, encoding="utf-8")

          tests_path = Path("Tests/LevelerDSPTests.cpp")
          tests = tests_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'\n// Test lookahead latency alignment\nstatic void testLookaheadLatency\(\)\n\{.*?\n\}\n\n// Test parameter boundary values',
              re.S)
          tests, count = pattern.subn("\n// Test parameter boundary values", tests, count=1)
          if count != 1:
              raise RuntimeError(f"Lookahead placeholder test: expected one block, found {count}")
          tests = replace_once(tests, "    testLookaheadLatency();\n", "", "Lookahead placeholder call")
          tests = replace_once(
              tests,
              "// Test true-peak inter-sample peak (Nyquist sine)",
              "// Test true-peak inter-sample peak (Fs/4 sine)",
              "True-peak test comment")
          tests = replace_once(
              tests,
              "// First 2 seconds: -30 LUFS (below -70 absolute gate but above relative)",
              "// First 2 seconds: a low-level tone that remains above the absolute loudness gate",
              "Loudness gate comment")
          tests_path.write_text(tests, encoding="utf-8")

          constants_path = Path("Source/Constants.h")
          constants = constants_path.read_text(encoding="utf-8")
          constants = replace_once(
              constants,
              "constexpr float truePeakHoldExtraSamples = 6;",
              "constexpr int truePeakHoldExtraSamples = 6;",
              "True-peak hold type")
          constants_path.write_text(constants, encoding="utf-8")

          engine_path = Path("Source/LevelerEngine.h")
          engine = engine_path.read_text(encoding="utf-8")
          engine = replace_once(
              engine,
              "timeConstantAlpha (80.0f)",
              "timeConstantAlpha (SantosConstants::peakEnvelopeReleaseMs)",
              "Peak envelope release constant")
          engine = replace_once(
              engine,
              "std::clamp (peakThresholdDb - predictedPeakDb, -9.0f, 0.0f)",
              "std::clamp (peakThresholdDb - predictedPeakDb, -SantosConstants::maxPeakReductionDb, 0.0f)",
              "Peak reduction limit constant")
          engine_path.write_text(engine, encoding="utf-8")

          limiter_path = Path("Source/TruePeakLimiter.h")
          limiter = limiter_path.read_text(encoding="utf-8")
          limiter = replace_once(
              limiter,
              "static_cast<int>(SantosConstants::truePeakHoldExtraSamples)",
              "SantosConstants::truePeakHoldExtraSamples",
              "True-peak hold cast")
          limiter_path.write_text(limiter, encoding="utf-8")

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "Santos Leveler CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/PluginEditor.h Source/Constants.h Source/LevelerEngine.h Source/TruePeakLimiter.h Tests/LevelerDSPTests.cpp
          git commit -m "cleanup: fix version metadata and test hygiene"
          git push origin HEAD:main
